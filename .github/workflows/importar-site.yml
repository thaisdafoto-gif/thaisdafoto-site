          LISTA
          fail=0
          while read -r sum path blob; do
            [ -z "$sum" ] && continue
            src="$B/_f/$V/$path"
            [ "$path" = "index.html" ] && src="$B/_f/$V/export/index.html.txt"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 -o "$path" "$src" || true
            got=$(sha256sum "$path" 2>/dev/null | cut -d' ' -f1)
            if [ "$got" != "$sum" ] && [ -n "$blob" ]; then
              curl -fsSL --retry 3 -o "$path" "$B/_blob/$blob" || true
              got=$(sha256sum "$path" 2>/dev/null | cut -d' ' -f1)
            fi
            if [ "$got" = "$sum" ]; then echo "ok   $path"; else echo "ERRO $path"; fail=1; fi
          done < "$RUNNER_TEMP/lista.txt"
          [ "$fail" = 0 ] || { echo "Arquivos nao conferem; nada foi salvo."; exit 1; }
          printf '{}\n' > .image-slots.state.json
          : > .nojekyll
          set -e
          T="$RUNNER_TEMP"
          repo="$GITHUB_REPOSITORY"
          : > "$T/itens.tsv"
          for f in $(awk '{print $2}' "$T/lista.txt") .image-slots.state.json .nojekyll; do
            base64 -w0 "$f" > "$T/b64.txt"
            jq -n --rawfile c "$T/b64.txt" '{content: $c, encoding: "base64"}' > "$T/blob.json"
            s=$(gh api "repos/$repo/git/blobs" --input "$T/blob.json" --jq .sha)
            printf '%s\t%s\n' "$f" "$s" >> "$T/itens.tsv"
          done
          jq -Rn --arg b "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $b, tree: [inputs | split("\t") | {path: .[0], mode: "100644", type: "blob", sha: .[1]}]}' < "$T/itens.tsv" > "$T/tree.json"
          tree=$(gh api "repos/$repo/git/trees" --input "$T/tree.json" --jq .sha)
          printf 'Adicionar arquivos do site\n\nClaude-Session: https://claude.ai/code/session_01DdagJitmhy4SJ2Vh7DcgQR\n' > "$T/msg.txt"
          jq -n --rawfile m "$T/msg.txt" --arg t "$tree" --arg p "$(git rev-parse HEAD)" '{message: $m, tree: $t, parents: [$p]}' > "$T/commit.json"
          novo=$(gh api "repos/$repo/git/commits" --input "$T/commit.json" --jq .sha)
          gh api -X PATCH "repos/$repo/git/refs/heads/main" -f sha="$novo" --jq .object.sha
          echo "Site salvo no repositorio."
